# The grant: pods of record-viewer may open the board.
apiVersion: v1
kind: Namespace
metadata:
  name: record-viewer
  labels:
    record-consumers/reads-board: "true"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Pod
metadata:
  name: probe
  namespace: record-viewer
spec:
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 1
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: record-consumers
      command: ["python", "-c", "import time; time.sleep(86400)"]
      resources:
        requests:
          cpu: 10m
          memory: 24Mi
        limits:
          cpu: 200m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
---
# No grant.
