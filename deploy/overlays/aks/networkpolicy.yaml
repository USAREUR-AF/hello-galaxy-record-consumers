# On AKS the decoder and the database are addresses, not pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: receiver-accepts-decoder
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: receiver
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - ipBlock:
            cidr: 203.0.113.16/28 # yours: where the decoder posts from
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: consumers-reach-database
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["receiver", "board"]
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock:
            cidr: 10.20.4.0/24 # yours: output postgresSubnet. opsec-allow: the default of main.bicep; it names no network
      ports:
        - protocol: TCP
          port: 5432
